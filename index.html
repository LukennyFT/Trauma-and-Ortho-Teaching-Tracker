<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Orthopaedics for the Foundation Doctor — T&amp;O Teaching Series</title>
<meta name="description" content="A four-session Trauma & Orthopaedics teaching series for final & penultimate year medical students." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Lexend:wght@500;600;700;800&display=swap" rel="stylesheet" />
<style>
/* ============================================================================
   THEME
   ========================================================================== */
:root{
  --bg:#0b1220;
  --bg-grad-1:#0e1b34;
  --bg-grad-2:#0b1220;
  --surface:#ffffff;
  --surface-2:#f4f7fb;
  --ink:#0f1f33;
  --ink-soft:#41566f;
  --ink-faint:#7488a0;
  --line:#e3eaf2;
  --primary:#0e7490;       /* teal */
  --primary-d:#0b5a72;
  --primary-l:#e0f4f9;
  --accent:#f59e0b;        /* gold/amber for game */
  --accent-d:#b9770a;
  --success:#16a34a;
  --success-l:#e7f6ec;
  --danger:#dc2626;
  --violet:#6d4aff;
  --radius:18px;
  --radius-s:12px;
  --shadow:0 10px 30px -12px rgba(8,22,43,.28);
  --shadow-lg:0 24px 60px -18px rgba(8,22,43,.45);
  --maxw:880px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:'Inter',system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
  color:var(--ink);
  background:radial-gradient(1200px 700px at 80% -10%, #14315a 0%, transparent 55%),
             radial-gradient(900px 600px at -10% 10%, #0d3b46 0%, transparent 50%),
             linear-gradient(160deg,var(--bg-grad-1),var(--bg-grad-2));
  background-attachment:fixed;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
  line-height:1.5;
}
h1,h2,h3,h4{font-family:'Lexend','Inter',sans-serif;line-height:1.15;margin:0 0 .4em;color:var(--ink)}
p{margin:0 0 1em}
a{color:var(--primary)}
small{color:var(--ink-faint)}

/* layout shell */
#app{max-width:var(--maxw);margin:0 auto;padding:18px 16px 64px;min-height:100vh}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;color:#dce8f5;padding:6px 4px 18px}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.brand .mark{width:38px;height:38px;border-radius:11px;background:linear-gradient(145deg,#19c2d6,#0e7490);display:grid;place-items:center;font-size:20px;box-shadow:0 8px 20px -8px rgba(25,194,214,.8);flex:none}
.brand .ttl{font-family:'Lexend';font-weight:700;font-size:15px;color:#fff;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand .sub{font-size:11.5px;color:#90b2d4}
.chip{font-size:12px;background:rgba(255,255,255,.1);color:#cfe1f2;border:1px solid rgba(255,255,255,.16);padding:5px 11px;border-radius:999px;backdrop-filter:blur(6px);cursor:pointer;white-space:nowrap}
.chip:hover{background:rgba(255,255,255,.18)}
.chip.code{font-variant-numeric:tabular-nums;letter-spacing:.5px}

/* cards */
.card{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow-lg);padding:26px 24px;animation:rise .45s cubic-bezier(.2,.8,.2,1)}
.card + .card{margin-top:16px}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.eyebrow{display:inline-flex;align-items:center;gap:7px;font-family:'Lexend';font-weight:600;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--primary);background:var(--primary-l);padding:6px 12px;border-radius:999px;margin-bottom:14px}
.lede{font-size:16px;color:var(--ink-soft)}
.muted{color:var(--ink-faint)}
hr.sep{border:none;border-top:1px solid var(--line);margin:22px 0}

/* buttons */
.btn{appearance:none;border:none;cursor:pointer;font-family:'Lexend';font-weight:600;font-size:15.5px;
  padding:14px 22px;border-radius:13px;display:inline-flex;align-items:center;justify-content:center;gap:9px;
  transition:transform .12s ease, box-shadow .2s ease, background .2s ease;text-decoration:none}
.btn:active{transform:translateY(1px)}
.btn-primary{background:linear-gradient(135deg,#12a3bd,#0e7490);color:#fff;box-shadow:0 12px 24px -10px rgba(14,116,144,.75)}
.btn-primary:hover{box-shadow:0 16px 30px -10px rgba(14,116,144,.85)}
.btn-accent{background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#3a2600;box-shadow:0 12px 24px -10px rgba(245,158,11,.7)}
.btn-ghost{background:var(--surface-2);color:var(--ink);border:1px solid var(--line)}
.btn-ghost:hover{background:#eaf0f7}
.btn-block{width:100%}
.btn[disabled]{opacity:1;cursor:not-allowed;background:#e7edf4 !important;color:#9fb0c4 !important;box-shadow:none !important}
.btn-row{display:flex;gap:12px;flex-wrap:wrap;margin-top:8px}
.btn-sm{padding:9px 14px;font-size:13.5px;border-radius:10px}

/* role / option selectors */
.opts{display:grid;gap:11px;margin:6px 0 4px}
.opt{position:relative;display:flex;align-items:center;gap:13px;padding:15px 16px;border:1.5px solid var(--line);border-radius:14px;cursor:pointer;background:var(--surface);transition:.15s}
.opt:hover{border-color:#bcd6e4;background:#fafdff}
.opt input{position:absolute;opacity:0;pointer-events:none}
.opt .tick{width:22px;height:22px;border-radius:50%;border:2px solid #cbd8e6;flex:none;display:grid;place-items:center;transition:.15s}
.opt .tick::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--primary);transform:scale(0);transition:.15s}
.opt .lbl{font-weight:500}
.opt.checkbox .tick{border-radius:7px}
.opt.checkbox .tick::after{border-radius:3px}
.opt:has(input:checked){border-color:var(--primary);background:var(--primary-l);box-shadow:0 0 0 3px rgba(14,116,144,.1)}
.opt:has(input:checked) .tick{border-color:var(--primary)}
.opt:has(input:checked) .tick::after{transform:scale(1)}
.opt.disabled{opacity:.45;pointer-events:none}
.inline-other{margin-top:9px;display:none}
.inline-other.show{display:block}

/* text inputs */
label.fld{display:block;font-weight:600;font-size:14px;margin:18px 0 7px;color:var(--ink)}
label.fld .req{color:var(--danger)}
input[type=text],input[type=date],textarea,select{
  width:100%;font-family:inherit;font-size:15px;color:var(--ink);background:var(--surface);
  border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;transition:.15s}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(14,116,144,.13)}
textarea{min-height:92px;resize:vertical}
.hint{font-size:12.5px;color:var(--ink-faint);margin-top:6px}

/* likert / scale segmented control */
.scale{display:flex;gap:8px;margin-top:6px}
.scale.compact{gap:6px}
.scale label{flex:1;position:relative;cursor:pointer}
.scale input{position:absolute;opacity:0;pointer-events:none}
.scale .seg{display:grid;place-items:center;padding:12px 0;border:1.5px solid var(--line);border-radius:11px;font-family:'Lexend';font-weight:700;font-size:16px;color:var(--ink-soft);background:var(--surface);transition:.13s;line-height:1}
.scale label:hover .seg{border-color:#bcd6e4}
.scale input:checked + .seg{background:var(--primary);border-color:var(--primary);color:#fff;transform:translateY(-2px);box-shadow:0 8px 16px -8px rgba(14,116,144,.7)}
.scale.conf input:checked + .seg{background:var(--accent);border-color:var(--accent);color:#3a2600;box-shadow:0 8px 16px -8px rgba(245,158,11,.7)}
.scale-ends{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-faint);margin-top:7px}

/* statement (likert) rows */
.statement{padding:16px 0;border-top:1px solid var(--line)}
.statement:first-of-type{border-top:none}
.statement .q{font-weight:600;font-size:14.5px;margin-bottom:4px}

/* survey blocks */
.block{margin-top:22px}
.block > h3{font-size:16px;display:flex;align-items:center;gap:9px}
.numpill{width:25px;height:25px;border-radius:8px;background:var(--primary-l);color:var(--primary-d);font-family:'Lexend';font-weight:700;font-size:13px;display:grid;place-items:center;flex:none}

/* aim / info callouts */
.callout{background:linear-gradient(135deg,#0e7490,#0b5a72);color:#eafaff;border-radius:16px;padding:20px 22px;box-shadow:0 16px 30px -16px rgba(14,116,144,.8)}
.callout h3{color:#fff;font-size:14px;letter-spacing:.1em;text-transform:uppercase;opacity:.85;margin-bottom:8px}
.callout p{margin:0;font-size:16.5px;line-height:1.45;font-family:'Lexend';font-weight:500}
.info{background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.info.privacy{background:#f3f0ff;border-color:#e0d8ff}
.info h4{margin:0 0 6px;font-size:14px;display:flex;align-items:center;gap:8px}
.info p,.info li{font-size:13.5px;color:var(--ink-soft)}
.info ul{margin:.3em 0;padding-left:20px}
.meta-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 22px;margin:4px 0 2px}
.meta-grid div{font-size:13.5px}
.meta-grid b{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-faint);font-weight:700}

/* timetable */
.tt{width:100%;border-collapse:collapse;margin-top:6px;font-size:13.5px}
.tt th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-faint);padding:8px 10px;border-bottom:2px solid var(--line)}
.tt td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.tt .n{font-family:'Lexend';font-weight:700;color:var(--primary);width:30px}
.tt .topic{font-weight:600}
.tt .focus{color:var(--ink-soft);font-size:12.5px}

/* steps list (order of events) */
.steps{display:grid;gap:0;margin-top:6px}
.step{display:flex;gap:14px;padding:14px 0;position:relative}
.step .dot{width:34px;height:34px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:17px;background:var(--primary-l);border:2px solid #bfe3ee;z-index:1}
.step:not(:last-child) .dot::after{content:"";position:absolute;left:16px;top:46px;bottom:-2px;width:2px;background:linear-gradient(var(--line),transparent)}
.step .body h4{margin:2px 0 3px;font-size:15px}
.step .body p{margin:0;font-size:13.5px;color:var(--ink-soft)}

/* ============================ GAME MAP ============================ */
.map-head{text-align:center;color:#eaf2fb;margin:4px 0 22px}
.map-head h1{color:#fff;font-size:26px;margin-bottom:6px}
.map-head p{color:#a9c4de;margin:0;font-size:14px}
.progress-wrap{max-width:340px;margin:16px auto 0}
.progress-track{height:10px;background:rgba(255,255,255,.14);border-radius:999px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,#fbbf24,#f59e0b);border-radius:999px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.progress-lbl{color:#a9c4de;font-size:12px;text-align:center;margin-top:8px}

.map{position:relative;display:flex;flex-direction:column;gap:30px;padding:8px 0 10px;max-width:560px;margin:0 auto}
.node{position:relative;display:flex;align-items:center;gap:18px;width:100%}
.node:nth-child(even){flex-direction:row-reverse;text-align:right}
.node .orb-wrap{position:relative;flex:none}
.node .orb{width:88px;height:88px;border-radius:26px;display:grid;place-items:center;font-size:34px;position:relative;
  transition:transform .18s ease, box-shadow .2s ease;border:3px solid rgba(255,255,255,.25)}
.node.locked .orb{background:rgba(255,255,255,.07);color:#6c84a0;border-color:rgba(255,255,255,.1);filter:grayscale(1)}
.node.unlocked .orb{background:linear-gradient(145deg,#19c2d6,#0e7490);color:#fff;cursor:pointer;box-shadow:0 18px 34px -14px rgba(25,194,214,.85)}
.node.unlocked .orb:hover{transform:translateY(-4px) scale(1.03)}
.node.done .orb{background:linear-gradient(145deg,#34d27a,#16a34a);color:#fff;cursor:pointer;box-shadow:0 18px 34px -14px rgba(22,163,74,.8)}
.node .orb .lvlnum{position:absolute;top:-10px;left:-10px;background:#0b1220;color:#fff;border:2px solid rgba(255,255,255,.5);width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-family:'Lexend';font-weight:800;font-size:13px}
.node:nth-child(even) .orb .lvlnum{left:auto;right:-10px}
.node .badge{position:absolute;bottom:-8px;right:-8px;font-size:22px;filter:drop-shadow(0 3px 4px rgba(0,0,0,.3))}
.node:nth-child(even) .badge{right:auto;left:-8px}
.node .info-c{flex:1;min-width:0}
.node .info-c .lvl-k{font-family:'Lexend';font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#7fa6c9}
.node .info-c h3{color:#fff;font-size:18px;margin:2px 0 4px}
.node.locked .info-c h3{color:#8ea4bd}
.node .info-c p{color:#9db8d4;font-size:13px;margin:0}
.node .info-c .state{display:inline-flex;align-items:center;gap:6px;margin-top:8px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px}
.node.locked .state{background:rgba(255,255,255,.07);color:#7e93ac}
.node.unlocked .state{background:rgba(25,194,214,.18);color:#7fe6f4}
.node.done .state{background:rgba(52,210,122,.18);color:#86efac}
.node.unlocked .orb{animation:pulse 2.4s infinite}
@keyframes pulse{0%,100%{box-shadow:0 18px 34px -14px rgba(25,194,214,.85),0 0 0 0 rgba(25,194,214,.45)}50%{box-shadow:0 18px 34px -14px rgba(25,194,214,.85),0 0 0 14px rgba(25,194,214,0)}}
.connector{position:absolute;left:50%;width:3px;background:repeating-linear-gradient(rgba(255,255,255,.28) 0 7px,transparent 7px 15px);z-index:0}
.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* lesson active / stopwatch */
.thanks-hero{text-align:center;padding:8px 0 4px}
.thanks-hero .big{font-size:54px;line-height:1;margin-bottom:10px}
.stopwatch{font-family:'Lexend';font-weight:800;font-variant-numeric:tabular-nums;font-size:60px;letter-spacing:1px;text-align:center;color:var(--primary-d);margin:18px 0 6px}
.sw-card{background:linear-gradient(160deg,#f0fbfd,#e0f4f9);border:1px solid #bfe3ee;border-radius:18px;padding:22px;text-align:center}
.sw-live{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:600;color:var(--primary-d);text-transform:uppercase;letter-spacing:.1em}
.sw-live .blink{width:9px;height:9px;border-radius:50%;background:var(--danger);animation:blink 1.1s infinite}
@keyframes blink{50%{opacity:.25}}

/* objective list */
.obj{display:grid;gap:9px;margin:6px 0 2px}
.obj li{list-style:none;display:flex;gap:10px;align-items:flex-start;font-size:14.5px;color:var(--ink-soft)}
.obj li .ic{color:var(--primary);flex:none;margin-top:2px}
ul.objx{margin:0;padding:0}

/* toast */
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:#0f1f33;color:#fff;padding:12px 20px;border-radius:12px;font-size:14px;font-weight:500;box-shadow:var(--shadow-lg);opacity:0;pointer-events:none;transition:.3s;z-index:99}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* code reveal */
.code-display{font-family:'Lexend';font-weight:800;font-size:clamp(24px,7vw,38px);letter-spacing:3px;text-align:center;color:var(--primary-d);
  background:linear-gradient(160deg,#f0fbfd,#e0f4f9);border:2px dashed #7fc6d8;border-radius:16px;padding:22px 12px;font-variant-numeric:tabular-nums;word-break:break-all}

/* footer / lead link */
.foot{text-align:center;margin-top:30px;color:#7e98b6;font-size:12.5px}
.foot a{color:#9db8d4;cursor:pointer;text-decoration:underline}

/* ============================ MASTER ============================ */
.master-tabs{display:flex;gap:8px;background:rgba(255,255,255,.08);padding:6px;border-radius:14px;margin-bottom:16px}
.master-tabs button{flex:1;border:none;background:transparent;color:#bcd2e8;font-family:'Lexend';font-weight:600;font-size:14px;padding:11px;border-radius:10px;cursor:pointer}
.master-tabs button.active{background:#fff;color:var(--primary-d);box-shadow:var(--shadow)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:6px 0}
.kpi{background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:16px}
.kpi .v{font-family:'Lexend';font-weight:800;font-size:26px;color:var(--primary-d);line-height:1}
.kpi .l{font-size:12px;color:var(--ink-faint);margin-top:6px}
.kpi .v small{font-size:14px;color:var(--ink-faint);font-weight:600}
.dtable{width:100%;border-collapse:collapse;font-size:13px;margin-top:4px}
.dtable th,.dtable td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:center;font-variant-numeric:tabular-nums}
.dtable th{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-faint);font-weight:700;background:var(--surface-2)}
.dtable td:first-child,.dtable th:first-child{text-align:left;font-weight:600}
.dtable tr.overall td{border-top:2px solid var(--primary);font-weight:700;background:var(--primary-l)}
.dtable .pos{color:var(--success);font-weight:700}
.scroll-x{overflow-x:auto;-webkit-overflow-scrolling:touch}
.theme-list{margin:0;padding-left:0;list-style:none;display:grid;gap:8px}
.theme-list li{background:var(--surface-2);border:1px solid var(--line);border-left:3px solid var(--primary);border-radius:10px;padding:10px 13px;font-size:13.5px;color:var(--ink-soft)}
.theme-list li .tag{font-size:10.5px;font-weight:700;color:var(--primary-d);text-transform:uppercase;letter-spacing:.05em;margin-right:7px}
.empty{color:var(--ink-faint);font-size:13.5px;font-style:italic;padding:8px 0}
.save-pill{font-size:12px;color:var(--success);font-weight:600;opacity:0;transition:.3s}
.save-pill.show{opacity:1}
.lead-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 16px}
/* signature pad */
.sigpad-wrap{position:relative;border:1.5px solid var(--line);border-radius:14px;background:
  linear-gradient(#fff,#fbfdff);overflow:hidden;box-shadow:inset 0 1px 3px rgba(15,31,51,.05);transition:border-color .2s, box-shadow .2s}
.sigpad-wrap.signed{border-color:var(--primary);box-shadow:inset 0 1px 3px rgba(14,116,144,.08),0 0 0 3px rgba(14,116,144,.08)}
.sigpad{display:block;width:100%;height:168px;touch-action:none;cursor:crosshair;-webkit-user-select:none;user-select:none}
.sigline{position:absolute;left:22px;right:22px;bottom:40px;border-bottom:1.6px solid #c7d5e2;pointer-events:none}
.sigline::before{content:"✕";position:absolute;left:-2px;bottom:2px;color:#c7d5e2;font-size:13px;font-weight:700}
.sigph{position:absolute;left:0;right:0;top:50%;transform:translateY(-60%);text-align:center;color:#9fb0c4;font-size:13.5px;
  pointer-events:none;transition:opacity .2s;display:flex;flex-direction:column;align-items:center;gap:4px}
.sigph .x{font-size:26px;opacity:.7}
.sigpad-wrap.signed .sigph,.sigpad-wrap.signed .sigline{opacity:0}
.sigbar{display:flex;justify-content:space-between;align-items:center;margin-top:8px;gap:10px}
.sigbar .sigstatus{font-size:12.5px;font-weight:600;color:var(--ink-faint)}
.sigbar .sigstatus.ok{color:var(--success)}
.report-doc h2{font-size:20px;border-bottom:2px solid var(--primary);padding-bottom:8px;margin-top:26px}
.report-doc h2:first-child{margin-top:0}
.sync-note{background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;border-radius:12px;padding:12px 14px;font-size:13px;display:flex;gap:9px;align-items:flex-start}

@media (max-width:560px){
  .card{padding:20px 16px}
  .meta-grid,.lead-grid{grid-template-columns:1fr}
  .node .orb{width:74px;height:74px;font-size:28px}
  .stopwatch{font-size:46px}
  .scale{gap:5px}
  .scale .seg{padding:11px 0;font-size:14px}
}

/* print (report) */
@media print{
  body{background:#fff}
  .topbar,.foot,.master-tabs,.no-print,.btn{display:none !important}
  #app{max-width:100%;padding:0}
  .card{box-shadow:none;padding:0;animation:none}
  .kpi,.info,.dtable th{background:#fff !important}
  .sigph,.sigline{display:none !important}   /* print only the drawn signature */
  .sigpad-wrap{border-color:#c7d5e2 !important;box-shadow:none !important}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>

<script>
/* ============================================================================
   CONFIGURATION
   ----------------------------------------------------------------------------
   MASTER_CODE  : the programme lead's private 16-digit code (created at
                  inception). Anyone entering this on the landing screen reaches
                  the master report + analytics. Keep it private.
   PROGRAMME_ID : namespaces this cohort's data (lets you reuse one Firebase
                  project for future cohorts — just change this string).
   FIREBASE_CONFIG : leave blank to run fully OFFLINE (single-device demo /
                  privacy mode). Paste your Firebase web-app config to switch on
                  real-time cloud sync so students' devices feed your master

const cloudEnabled = !!(FIREBASE_CONFIG && FIREBASE_CONFIG.apiKey);
const LKEY = (sub) => `to:${PROGRAMME_ID}:${sub}`;
let db = null;

function loadScript(src){
  return new Promise((res,rej)=>{ const s=document.createElement('script'); s.src=src; s.onload=res; s.onerror=rej; document.head.appendChild(s); });
}

/* Merge a cloud record with a local one, keeping the richest version of each
   lesson. Returns the merged record plus how many lessons the LOCAL copy
   contributed (i.e. feedback captured while the app was offline). */
function mergeStudentRecords(cloud, local){
  const merged=Object.assign({},cloud);
  let recovered=0;
  merged.needs = cloud.needs || local.needs || null;
  if(!cloud.needs && local.needs) recovered++;
  const cl=cloud.lessons||{}, ll=local.lessons||{};
  const out=Object.assign({},cl);
  Object.keys(ll).forEach(k=>{
    const a=cl[k], b=ll[k];
    if(!b) return;
    if(!a){ out[k]=b; if(b.feedback) recovered++; return; }
    // both exist — prefer whichever actually has feedback; if both, the later one
    if(a.feedback && b.feedback){
      out[k] = (b.feedback.submittedAt||0) > (a.feedback.submittedAt||0) ? b : a;
    } else if(b.feedback && !a.feedback){
      out[k]=b; recovered++;
    } else {
      out[k]=a;
    }
  });
  merged.lessons=out;
  if((local.updatedAt||0)>(cloud.updatedAt||0)) merged.updatedAt=local.updatedAt;
  return {merged,recovered};
}

const Store = {
  ready:false,
  async init(){
    if(cloudEnabled){
      try{
        await loadScript("https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js");
        await loadScript("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js");
        firebase.initializeApp(FIREBASE_CONFIG);
        db = firebase.firestore();
      }catch(e){ console.error("Firebase init failed — falling back to offline.",e); db=null; }
    }
    this.ready=true;
  },
  _col(){ return db.collection("programmes").doc(PROGRAMME_ID).collection("students"); },
  _metaDoc(){ return db.collection("programmes").doc(PROGRAMME_ID).collection("meta").doc("report"); },

  async saveStudent(rec){
    rec.updatedAt = Date.now();
    localStorage.setItem(LKEY("student:"+rec.syncCode), JSON.stringify(rec));
    if(db){ try{ await this._col().doc(rec.syncCode).set(rec,{merge:true}); }catch(e){ console.error("cloud save failed",e);} }
  },
  async getStudent(code){
    // Read BOTH sides and merge. Anything recorded while the app was running
    // offline lives only in localStorage — merging recovers it and pushes it up,
    // instead of the cloud copy silently overwriting it.
    let local=null;
    try{ const raw=localStorage.getItem(LKEY("student:"+code)); if(raw) local=JSON.parse(raw); }catch(e){}
    let cloud=null;
    if(db){ try{ const d=await this._col().doc(code).get(); if(d.exists) cloud=d.data(); }catch(e){ console.error(e); } }
    if(!cloud) return local;
    if(!local) return cloud;
    const {merged,recovered}=mergeStudentRecords(cloud,local);
    if(db && recovered>0){
      try{
        await this._col().doc(code).set(merged,{merge:true});
        console.info(`Recovered ${recovered} offline lesson record(s) for ${code} and synced to cloud.`);
      }catch(e){ console.error("recovery sync failed",e); }
    }
    localStorage.setItem(LKEY("student:"+code),JSON.stringify(merged));
    return merged;
  },
  _localStudents(){
    const out=[]; const pre=LKEY("student:");
    for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); if(k&&k.startsWith(pre)){ try{out.push(JSON.parse(localStorage.getItem(k)));}catch(e){} } }
    return out;
  },
  subscribeStudents(cb){
    if(db){
      return this._col().onSnapshot(snap=>{ cb(snap.docs.map(d=>d.data())); }, err=>console.error(err));
    }
    // offline: poll + storage events
    const tick=()=>cb(this._localStudents());
    tick();
    const onStorage=(e)=>{ if(e.key&&e.key.startsWith(LKEY("student:"))) tick(); };
    window.addEventListener("storage",onStorage);
    const iv=setInterval(tick,2000);
    return ()=>{ window.removeEventListener("storage",onStorage); clearInterval(iv); };
  },
  async saveMaster(data){
    localStorage.setItem(LKEY("meta:report"),JSON.stringify(data));
    if(db){ try{ await this._metaDoc().set(data,{merge:true}); }catch(e){ console.error(e);} }
  },
  async getMaster(){
    if(db){ try{ const d=await this._metaDoc().get(); if(d.exists) return d.data(); }catch(e){ console.error(e);} }
    const raw=localStorage.getItem(LKEY("meta:report"));
    return raw?JSON.parse(raw):{};
  }
};

function bindLanding(){
  const genBtn=$("#genBtn");
  const otherWrap=$("#otherWrap");
  const otherInput=$("#roleOther");
  function refresh(){
    const sel=$('input[name=role]:checked');
    state.pendingRole = sel?sel.value:null;
    const isOther = state.pendingRole==="Other";
    otherWrap.classList.toggle("show",isOther);
    if(isOther) state.pendingRoleOther = otherInput?otherInput.value.trim():"";
    const valid = !!state.pendingRole && (!isOther || (state.pendingRoleOther||"").length>0);
    genBtn.disabled = !valid;
  }
  $$('input[name=role]').forEach(r=>r.onchange=refresh);
  if(otherInput) otherInput.oninput=refresh;
  refresh();
  genBtn.onclick=async()=>{
    const code=genCode();
    state.student={
      syncCode:code, role:state.pendingRole, roleOther:state.pendingRoleOther,
      createdAt:Date.now(), needs:null, lessons:{}
    };
    localStorage.setItem(LKEY("last"),code);
    await Store.saveStudent(state.student);
    navigate("code");
  };
  $$('[data-act="resume"]').forEach(b=>b.onclick=resumeFlow);
}

async function resumeFlow(){
  const input=prompt("Enter your 16-digit sync code:");
  if(!input) return;
  const code=normCode(input);
  if(code.length!==16){ toast("That code isn’t 16 digits"); return; }
  if(code===MASTER_CODE){ navigate("master"); return; }
  const rec=await Store.getStudent(code);
  if(!rec){ toast("No progress found for that code"); return; }
  state.student=rec; localStorage.setItem(LKEY("last"),code);
  routeResume();
}

/* ============================================================================
   MASTER: data computation
   ========================================================================== */
function buildRows(students){
  const rows=[];
  (students||[]).forEach(s=>{
    if(!s||!s.lessons) return;
    LESSONS.forEach(l=>{
      const r=s.lessons[l.n];
      if(r&&r.feedback){
        const fb=r.feedback;
        rows.push({
          session:l.n, date:fb.date||"", role:roleLabel(s),
          q:fb.q, before:r.beforeConfidence, after:fb.after,
          shift:(fb.after!=null&&r.beforeConfidence!=null)?fb.after-r.beforeConfidence:null,
          mostUseful:fb.mostUseful, toImprove:fb.toImprove, futureTopics:fb.futureTopics,
          durationMs:r.durationMs||null, syncCode:s.syncCode
        });
      }
    });
  });
  return rows;
}
const mean=(arr)=>{ const v=arr.filter(x=>x!=null&&!isNaN(x)); return v.length?v.reduce((a,b)=>a+b,0)/v.length:null; };
const f1=(x)=> x==null?"—":(Math.round(x*10)/10).toFixed(1);
const f1c=(x)=> x==null?"":(Math.round(x*10)/10).toFixed(1);  // CSV-safe (blank, not dash)

function stats(rows,session){
  const r = session==="all"?rows:rows.filter(x=>x.session===session);
  const n=r.length;
  const qMeans=[0,1,2,3,4,5].map(i=>mean(r.map(x=>x.q?x.q[i]:null)));
  const meanRating=mean(qMeans.filter(x=>x!=null));
  const cb=mean(r.map(x=>x.before)), ca=mean(r.map(x=>x.after));
  const shift=(cb!=null&&ca!=null)?ca-cb:null;
  const recCount=r.filter(x=>x.q&&x.q[5]>=4).length;
  const recPct=n?Math.round(recCount/n*100):null;
  return {n,qMeans,meanRating,cb,ca,shift,recPct};
}

/* ---------- MASTER: CHARTS (inline SVG — reproduces & improves the Excel charts) ---------- */
// Chart 1 (Excel: "Confidence before vs after, by session") — grouped columns,
// improved with a fixed 0–5 axis, value labels, an explicit gain figure, and an Overall group.
function svgConfidenceBySession(){
  const cats=[{k:1,l:"S1"},{k:2,l:"S2"},{k:3,l:"S3"},{k:4,l:"S4"},{k:"all",l:"Overall"}];
  // generous top band (plotTop=78) so the value label + gain figure always sit
  // ABOVE a full-height (5.0) bar without clipping or colliding with the legend.
  const W=720,H=326,plotTop=78,base=276,plotL=56,plotR=704;
  const plotW=plotR-plotL, unit=(base-plotTop)/5, groupW=plotW/cats.length, barW=Math.min(38,groupW/2-9);
  const yOf=v=>base-v*unit;
  let g="";
  // legend — top-left, in the reserved band, clear of the bars/gain labels
  g+=`<rect x="${plotL}" y="8" width="12" height="12" rx="3" fill="#94a3b8"/><text x="${plotL+18}" y="18" font-size="11.5" fill="#41566f">Before</text>`;
  g+=`<rect x="${plotL+78}" y="8" width="12" height="12" rx="3" fill="#0e7490"/><text x="${plotL+96}" y="18" font-size="11.5" fill="#41566f">After</text>`;
  for(let t=0;t<=5;t++){ const y=base-t*unit; g+=`<line x1="${plotL}" y1="${y}" x2="${plotR}" y2="${y}" stroke="#eef2f7"/><text x="${plotL-8}" y="${y+4}" text-anchor="end" font-size="11" fill="#7488a0">${t}</text>`; }
  g+=`<line x1="${plotL}" y1="${base}" x2="${plotR}" y2="${base}" stroke="#cbd5e1"/>`;
  cats.forEach((c,i)=>{
    const s=stats(state.rows,c.k), cx=plotL+groupW*i+groupW/2, bx=cx-barW-3, ax=cx+3;
    const bar=(x,v,fill)=> v==null
      ? `<text x="${x+barW/2}" y="${base-6}" text-anchor="middle" font-size="11" fill="#b6c2d2">–</text>`
      : `<rect x="${x}" y="${yOf(v)}" width="${barW}" height="${base-yOf(v)}" rx="5" fill="${fill}"/><text x="${x+barW/2}" y="${yOf(v)-6}" text-anchor="middle" font-size="11" font-weight="700" fill="#41566f">${f1(v)}</text>`;
    g+=bar(bx,s.cb,"#94a3b8")+bar(ax,s.ca,"#0e7490");
    if(s.cb!=null&&s.ca!=null){ const sh=s.ca-s.cb, yb=Math.max(Math.min(yOf(s.cb),yOf(s.ca))-22,30), fill=sh>0?'#16a34a':(sh<0?'#dc2626':'#7488a0'); g+=`<text x="${cx}" y="${yb}" text-anchor="middle" font-size="11.5" font-weight="800" fill="${fill}">${(sh>0?'+':'')+f1(sh)}</text>`; }
    g+=`<text x="${cx}" y="${base+18}" text-anchor="middle" font-size="12" font-weight="600" fill="#41566f">${c.l}</text>`;
  });
  g+=`<text transform="translate(16 ${(plotTop+base)/2}) rotate(-90)" text-anchor="middle" font-size="11" fill="#7488a0">Mean confidence (1–5)</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block" font-family="Inter,system-ui,sans-serif" role="img" aria-label="Confidence before vs after by session">${g}</svg>`;
}
// Chart 2 (Excel: "Overall mean rating per question") — horizontal bars,
// improved with score colour-banding, value labels and an overall-mean reference line.
function svgRatingByQuestion(){
  const labels=["Q1 Relevant","Q2 Pitched","Q3 Clear","Q4 Objectives","Q5 Confidence","Q6 Recommend"];
  const o=stats(state.rows,"all"), vals=o.qMeans;
  const W=720,rowH=33,top=12,gx=170,plotW=506,step=plotW/5,plotH=labels.length*rowH,H=top+plotH+30;
  const col=v=> v==null?"#cbd5e1": v>=4?"#16a34a": v>=3?"#f59e0b":"#dc2626";
  let g="";
  for(let t=0;t<=5;t++){ const x=gx+t*step; g+=`<line x1="${x}" y1="${top}" x2="${x}" y2="${top+plotH}" stroke="#eef2f7"/><text x="${x}" y="${top+plotH+18}" text-anchor="middle" font-size="11" fill="#7488a0">${t}</text>`; }
  labels.forEach((lb,i)=>{
    const v=vals[i], y=top+i*rowH+6, bh=20, w=v==null?0:v*step;
    g+=`<text x="${gx-10}" y="${y+14}" text-anchor="end" font-size="12" fill="#41566f" font-weight="600">${lb}</text>`;
    g+=`<rect x="${gx}" y="${y}" width="${plotW}" height="${bh}" rx="5" fill="#f4f7fb"/>`;
    if(v!=null) g+=`<rect x="${gx}" y="${y}" width="${w}" height="${bh}" rx="5" fill="${col(v)}"/>`;
    g+=`<text x="${gx+(v==null?6:Math.min(w,plotW-2)+8)}" y="${y+14}" font-size="12" font-weight="700" fill="${v==null?'#9fb0c4':'#0f1f33'}">${v==null?'–':f1(v)}</text>`;
  });
  if(o.meanRating!=null){ const x=gx+o.meanRating*step; g+=`<line x1="${x}" y1="${top-3}" x2="${x}" y2="${top+plotH+2}" stroke="#0e7490" stroke-dasharray="4 3" stroke-width="1.5"/><text x="${x}" y="${top-5}" text-anchor="middle" font-size="10" font-weight="700" fill="#0e7490">mean ${f1(o.meanRating)}</text>`; }
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block" font-family="Inter,system-ui,sans-serif" role="img" aria-label="Overall mean rating per question">${g}</svg>`;
}

/* Touch/stylus/mouse signature pad for the supervisor's remote sign-off.
   Stores a PNG data URL in the hidden [data-meta="verifiedSignature"] field, so
   it saves & syncs through the same master-meta path as every other report field. */
function setupSignaturePad(){
  const wrap=$("#sigWrap"), canvas=$("#sigPad"), data=$("#sigData"), status=$("#sigStatus"), clearBtn=$("#sigClear");
  if(!canvas) return;
  const dpr=window.devicePixelRatio||1, ctx=canvas.getContext("2d");
  function fit(){
    const r=canvas.getBoundingClientRect(), w=Math.max(1,Math.round(r.width)), h=Math.max(1,Math.round(r.height));
    canvas.width=w*dpr; canvas.height=h*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.lineWidth=2.4; ctx.lineCap="round"; ctx.lineJoin="round"; ctx.strokeStyle="#12324a";
    return {w,h};
  }
  const size=fit();
  if(data.value){ const img=new Image(); img.onload=()=>ctx.drawImage(img,0,0,size.w,size.h); img.src=data.value; }
  let drawing=false, last=null, dirty=false;
  const pos=(e)=>{ const r=canvas.getBoundingClientRect(); return {x:e.clientX-r.left,y:e.clientY-r.top}; };
  const commit=()=>{
    data.value=canvas.toDataURL("image/png");
    data.dispatchEvent(new Event("change",{bubbles:true}));   // -> autosave to master doc
    status.textContent="✓ Signed — saved"; status.classList.add("ok");
  };
  canvas.addEventListener("pointerdown",e=>{ e.preventDefault(); drawing=true; last=pos(e); wrap.classList.add("signed"); try{canvas.setPointerCapture(e.pointerId);}catch(_){} });
  canvas.addEventListener("pointermove",e=>{ if(!drawing)return; e.preventDefault(); const p=pos(e); ctx.beginPath(); ctx.moveTo(last.x,last.y); ctx.lineTo(p.x,p.y); ctx.stroke(); last=p; dirty=true; });
  const stop=()=>{ if(!drawing)return; drawing=false; if(dirty) commit(); };
  canvas.addEventListener("pointerup",stop);
  canvas.addEventListener("pointercancel",stop);
  if(clearBtn) clearBtn.onclick=()=>{
    ctx.clearRect(0,0,canvas.width,canvas.height); dirty=false;
    data.value=""; data.dispatchEvent(new Event("change",{bubbles:true}));
    wrap.classList.remove("signed"); status.textContent="Not yet signed"; status.classList.remove("ok");
  };
}

function csvCell(v){ v=v==null?"":String(v); return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; }
function downloadCSV(name,rows){
  const csv=rows.map(r=>r.map(csvCell).join(",")).join("\r\n");
  const blob=new Blob(["﻿"+csv],{type:"text/csv;charset=utf-8"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
function downloadResponsesCSV(){
  const head=["Session","Date","Role","Q1 Relevant","Q2 Pitched right","Q3 Clear & organised","Q4 Met objectives","Q5 Felt more confident","Q6 Would recommend","Confidence BEFORE","Confidence AFTER","Confidence shift","Most useful","To improve","Future topics","Session time","Sync code"];
  const body=state.rows.map(r=>[r.session,r.date,r.role,...r.q,r.before,r.after,r.shift,r.mostUseful,r.toImprove,r.futureTopics,r.durationMs?fmtDur(r.durationMs):"",r.syncCode]);
  downloadCSV("TO-feedback-responses.csv",[head,...body]);
}
function downloadDashboardCSV(){
  const cols=[1,2,3,4].map(n=>stats(state.rows,n)); const allS=stats(state.rows,"all");
  const metricRows=[
    ["Responses (n)",...cols.map(s=>s.n||0),allS.n||0],
    ["Q1 – Relevant to my role",...cols.map(s=>f1c(s.qMeans[0])),f1c(allS.qMeans[0])],
    ["Q2 – Pitched at right level",...cols.map(s=>f1c(s.qMeans[1])),f1c(allS.qMeans[1])],
    ["Q3 – Clear & well organised",...cols.map(s=>f1c(s.qMeans[2])),f1c(allS.qMeans[2])],
    ["Q4 – Met learning objectives",...cols.map(s=>f1c(s.qMeans[3])),f1c(allS.qMeans[3])],
    ["Q5 – Felt more confident",...cols.map(s=>f1c(s.qMeans[4])),f1c(allS.qMeans[4])],
    ["Q6 – Would recommend",...cols.map(s=>f1c(s.qMeans[5])),f1c(allS.qMeans[5])],
    ["Mean rating (Q1–Q6)",...cols.map(s=>f1c(s.meanRating)),f1c(allS.meanRating)],
    ["Confidence — before",...cols.map(s=>f1c(s.cb)),f1c(allS.cb)],
    ["Confidence — after",...cols.map(s=>f1c(s.ca)),f1c(allS.ca)],
    ["Confidence shift",...cols.map(s=>s.shift==null?"":f1c(s.shift)),allS.shift==null?"":f1c(allS.shift)]
  ];
  downloadCSV("TO-feedback-dashboard.csv",[["Metric","S1","S2","S3","S4","Overall"],...metricRows]);
}

/* ============================================================================
   ROUTING / BOOT
   ========================================================================== */
function routeResume(){
  const s=state.student;
  if(!s){ navigate("landing"); return; }
  // active lesson?
  const active=LESSONS.find(l=>isActive(l.n));
  if(active){ navigate("lessonActive",{lesson:active.n}); return; }
  if(!s.needs){ navigate("overview"); return; }
  if(completedCount()===LESSONS.length){ navigate("map"); return; }
  navigate("map");
}

// attach post-render binders
const _render=render;
render=function(){
  _render();
  switch(state.screen){
    case "landing": bindLanding(); break;
    case "code": bindCode(); break;
    case "overview": bindOverview(); break;
    case "survey": bindSurvey(); break;
    case "map": bindMap(); break;
    case "lessonIntro": bindLessonIntro(); break;
    case "lessonActive": bindLessonActive(); break;
    case "feedback": bindFeedback(); break;
    case "done": bindDone(); break;
    case "leadGate": bindLeadGate(); break;
    case "master": bindMaster(); break;
  }
};

(async function boot(){
  await Store.init();
  const last=localStorage.getItem(LKEY("last"));
  if(location.hash==="#lead"){ navigate("leadGate"); return; }
  if(last){
    const rec=await Store.getStudent(last);
    if(rec){ state.student=rec; routeResume(); return; }
  }
  navigate("landing");
})();
</script>
